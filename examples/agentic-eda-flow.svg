    <style>.heading{font:700 29px Inter,Arial,sans-serif;fill:#0f172a}.sub{font:400 14px Inter,Arial,sans-serif;fill:#64748b}.section{font:700 12px Inter,Arial,sans-serif;letter-spacing:1.5px}.label{font:700 14px Inter,Arial,sans-serif;fill:#0f172a}.small{font:400 11px Inter,Arial,sans-serif;fill:#475569}.metric{font:700 12px Inter,Arial,sans-serif}.line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}</style>
