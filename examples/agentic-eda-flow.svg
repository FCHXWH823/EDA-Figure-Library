<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" width="1500" height="900" role="img" aria-labelledby="title desc">
  <title id="title">Agentic electronic design automation flow</title><desc id="desc">Multi-agent orchestration with design-space exploration, evolutionary optimization, GPU compute, and cross-stage feedback.</desc>
