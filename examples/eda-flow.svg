<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 690" width="1500" height="690" role="img" aria-labelledby="title desc">
  <title id="title">Complete electronic design automation flow</title>
  <desc id="desc">A publication-ready overview from specification and architecture through RTL, HLS, synthesis, verification, physical design, GDSII, and tape-out.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker>
    <marker id="feedback" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#f59e0b"/></marker>
    <style>.heading{font:700 28px Inter,Arial,sans-serif;fill:#0f172a}.sub{font:400 14px Inter,Arial,sans-serif;fill:#64748b}.phase{font:700 13px Inter,Arial,sans-serif;letter-spacing:1.5px}.name{font:700 15px Inter,Arial,sans-serif;fill:#0f172a}.detail{font:400 11.5px Inter,Arial,sans-serif;fill:#475569}.artifact{font:600 11px Inter,Arial,sans-serif;fill:#334155}.flow{fill:none;stroke:#64748b;stroke-width:2.3;marker-end:url(#arrow)}</style>
  </defs>
  <text x="54" y="58" class="heading">From intent to silicon</text><text x="54" y="86" class="sub">A reusable map of the digital EDA flow · verification and signoff feedback remain active across stages</text>
